  /* red corner flag for a modern accent */
  .poster::before{content:"";position:absolute;top:0;left:0;width:90px;height:8px;background:var(--red);z-index:4}

  /* "Buy Tickets" button, centered below the poster */
  .buy-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    padding:20px 56px;border:0;cursor:pointer;
    font-family:var(--font-body);text-transform:uppercase;letter-spacing:.22em;
    font-weight:700;font-size:clamp(15px,1.5vw,20px);color:#fff;
    background:var(--red);
    box-shadow:0 12px 30px rgba(232,35,43,.4);
    transition:transform .25s cubic-bezier(.2,.7,.2,1), background .25s ease, box-shadow .25s ease;
  }
  .buy-btn:hover{
    transform:translateY(-2px);
    background:#fff;color:var(--bg);
    box-shadow:0 16px 36px rgba(0,0,0,.5);
  }
  .buy-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}

  @media (max-aspect-ratio: 3/2){
    .poster{width:100%;height:auto}
  }
